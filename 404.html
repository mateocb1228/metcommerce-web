<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página no encontrada — MetCommerce</title>
    <meta name="theme-color" content="#03045e">

    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icono-192.png">
    <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
    <!-- Rutas absolutas: Netlify sirve esta página en cualquier URL que no exista, también en subcarpetas -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <nav class="navbar">
        <a href="/" class="nav-logo">
            <img src="/img/logo-icono.webp" alt="" width="138" height="120" decoding="async">
            <span class="nav-logo-texto">MetCommerce</span>
        </a>
        <a href="/" class="btn-nav btn-nav-visible">Volver al inicio</a>
    </nav>

    <main class="error-404">
        <p class="error-404-codigo" aria-hidden="true">404</p>
        <h1>No encontramos esta página</h1>
        <p class="error-404-texto">Puede que el enlace esté mal escrito o que la página ya no exista.</p>
        <div class="error-404-botones">
            <a href="/" class="btn-principal">Ir al inicio</a>
            <a href="/#precios" class="btn-borde">Ver planes</a>
            <a href="/#contacto" class="btn-borde">Contactarnos</a>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-contenido">
            <p>© 2026 MetCommerce — Plataforma de ventas en línea para negocios locales</p>
            <p>San Pedro de los Milagros, Antioquia, Colombia</p>
        </div>
    </footer>

    <script data-goatcounter="https://metcommerce.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
